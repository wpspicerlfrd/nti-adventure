<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTI Quest Island: Fire Rescue Edition</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e74c3c">
</head>
<body>
    <div id="app">
        <header>
            <h1>🚨 NTI Quest: Fire & Rescue Academy 🚒</h1>
            <div id="timer-display">Time: <span id="time">00:00</span></div>
        </header>

        <!-- Dynamic Quest Map Screen -->
        <main id="quest-map" class="screen">
            <h2>Select Your Mission</h2>
            <div class="island-grid" id="island-grid-container">
                <!-- Populated dynamically by app.js -->
            </div>
        </main>

        <!-- Activity Screen -->
        <section id="activity-screen" class="screen hidden">
            <button class="back-btn" onclick="returnToMap()">⬅ Back to Map</button>
            <div id="activity-content"></div>
        </section>

        <!-- Certificate Screen -->
        <div id="certificate-modal" class="hidden">
            <div class="cert-box">
                <h2>🌟 NTI CERTIFICATE OF COMPLETION 🌟</h2>
                <p>This certifies that</p>
                <h3 id="cert-name">Cadet</h3>
                <p>successfully completed all NTI Fire & Rescue Missions!</p>
                <p><strong>Total Time:</strong> <span id="cert-time">0 min</span></p>
                <p><strong>Completed On:</strong> November 13, 2026</p>
                <button onclick="takeScreenshotAction()">📸 Take Screenshot / Done</button>
            </div>
        </div>
    </div>
    <script src="days-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
